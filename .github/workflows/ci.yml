name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Install Gio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev
      - run: go vet ./...
      - run: go test ./...

  # Creates a project with giode new and builds it for every target the
  # runner can, checking that giode.toml's additions reach the Android
  # manifest and the Info.plist.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install Gio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev \
            nsis osslsigncode
      - name: Install the CLI
        run: go install ./cmd/giode
      - name: Create a project
        working-directory: ${{ runner.temp }}
        run: |
          giode new -id org.giode.demo -no-git demo
          cat >> demo/giode.toml <<'TOML'

          [ios.usage]
          camera = "To attach photos."
          TOML
          sed -i 's/^# keep_alive = true.*/keep_alive = true/; s/^# permissions = .*/permissions = ["network", "camera"]/' demo/giode.toml
          # The app's own Java, compiled into the APK, and an attribute
          # on <application>.
          sed -i 's/^\[app\]$/[app]\nsplash_color = "#0A0A0B"\nsplash_color_light = "#F4F4F6"/' demo/giode.toml
          sed -i 's/^\[android\]$/[android]\njava = ["java"]\nicon_background = "#0f172a"\nicon_monochrome = "assets\/icon.png"/' demo/giode.toml
          printf '\n[android.application_attributes]\nrequestLegacyExternalStorage = "true"\n' >> demo/giode.toml
          mkdir -p demo/java/org/giode/demo
          printf 'package org.giode.demo;\npublic final class Hello {\n  public static String hello(android.content.Context c) { return c.getPackageName(); }\n}\n' > demo/java/org/giode/demo/Hello.java
          cat demo/giode.toml
      - name: Doctor
        working-directory: ${{ runner.temp }}/demo
        run: giode doctor
      - name: Build
        working-directory: ${{ runner.temp }}/demo
        run: giode build -x android windows linux web
      - name: Build a signed Windows installer
        working-directory: ${{ runner.temp }}/demo
        env:
          GIODE_WINDOWS_CERT_PASS: ci-test-password
        run: |
          giode cert
          giode build -x -release windows-installer
          for f in dist/windows/Demo.exe dist/windows/Demo-0.1.0-amd64-setup.exe; do
            # The certificate is self-signed, so verification of its
            # chain fails; check the signature is ours and timestamped.
            osslsigncode verify -in "$f" > verify.txt 2>&1 || true
            cat verify.txt
            grep -q "Subject: /CN=Demo\|Subject: CN=Demo" verify.txt
            grep -q "Timestamp" verify.txt
          done
      - name: Check the Android manifest
        working-directory: ${{ runner.temp }}/demo
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump xmltree --file AndroidManifest.xml dist/android/Demo.apk | tee manifest.txt
          for want in org.giode.mobile.KeepAliveService FOREGROUND_SERVICE_DATA_SYNC POST_NOTIFICATIONS android.permission.CAMERA android.permission.INTERNET requestLegacyExternalStorage; do
            grep -q "$want" manifest.txt || { echo "manifest lacks $want"; exit 1; }
          done
          unzip -p dist/android/Demo.apk 'classes*.dex' | grep -aq 'Lorg/giode/demo/Hello;' || { echo "the app's Java class isn't in the APK"; exit 1; }
          # The adaptive icon's own layers.
          unzip -l dist/android/Demo.apk | tee apk.txt | grep -q 'mipmap-xxxhdpi.*/ic_launcher_foreground.png' || { echo "no foreground layer"; exit 1; }
          grep -q 'ic_launcher_monochrome.png' apk.txt || { echo "no monochrome layer"; exit 1; }
          "$aapt2" dump xmltree --file res/mipmap-anydpi-v26/ic_launcher.xml dist/android/Demo.apk | tee icon.txt
          grep -q monochrome icon.txt || { echo "ic_launcher.xml lacks <monochrome>"; exit 1; }
      - name: Check the other outputs
        working-directory: ${{ runner.temp }}/demo
        run: |
          file dist/windows/Demo.exe | grep -q "PE32+"
          test -x dist/linux/demo
          test -f dist/linux/org.giode.demo.desktop
          test -f dist/web/main.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: demo-builds
          path: ${{ runner.temp }}/demo/dist
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install the CLI
        run: go install ./cmd/giode
      - name: Create a project
        working-directory: ${{ runner.temp }}
        run: |
          giode new -id org.giode.demo -no-git demo
          cat >> demo/giode.toml <<'TOML'

          [ios.usage]
          camera = "To attach photos."
          microphone = "To dictate."

          [ios.plist]
          ITSAppUsesNonExemptEncryption = false
          TOML
          perl -pi -e 's/^\[app\]$/[app]\nsplash_color = "#0A0A0B"\nsplash_color_light = "#F4F4F6"/' demo/giode.toml
          cat demo/giode.toml
      - name: Build
        working-directory: ${{ runner.temp }}/demo
        run: giode build -x ios-sim macos
      - name: Check the Info.plist
        working-directory: ${{ runner.temp }}/demo
        run: |
          plutil -p dist/ios/Demo.app/Info.plist | tee plist.txt
          grep -q '"NSCameraUsageDescription" => "To attach photos."' plist.txt
          grep -q '"NSMicrophoneUsageDescription" => "To dictate."' plist.txt
          grep -q '"ITSAppUsesNonExemptEncryption" => false' plist.txt
          grep -q '"UIColorName" => "GiodeLaunchBackground"' plist.txt
          test -d dist/macos/Demo.app

  # Builds, signs, installs and uninstalls the Windows installer on
  # Windows, with NSIS and signtool from the runner image.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install the CLI
        run: go install ./cmd/giode
      - name: Create a project
        working-directory: ${{ runner.temp }}
        run: giode new -id org.giode.demo -no-git demo
      - name: Build a signed installer
        working-directory: ${{ runner.temp }}/demo
        env:
          GIODE_WINDOWS_CERT_PASS: ci-test-password
        run: |
          giode doctor
          giode cert
          giode build -x -release windows-installer
      - name: Check the signatures
        working-directory: ${{ runner.temp }}/demo
        shell: pwsh
        run: |
          foreach ($f in 'dist\windows\Demo.exe', 'dist\windows\Demo-0.1.0-amd64-setup.exe') {
            $s = Get-AuthenticodeSignature $f
            "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            # Self-signed, so not trusted, but signed by our certificate.
            if ($s.SignerCertificate.Subject -ne 'CN=Demo') { exit 1 }
          }
      - name: Install, check and uninstall
        working-directory: ${{ runner.temp }}/demo
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath 'dist\windows\Demo-0.1.0-amd64-setup.exe' -ArgumentList '/S'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Demo'
          if (-not (Test-Path (Join-Path $dir 'Demo.exe'))) { throw 'Demo.exe not installed' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\org.giode.demo'
          Get-ItemProperty $key | Format-List DisplayName, DisplayVersion, Publisher, UninstallString
          # _?= runs the uninstaller in place, so -Wait waits for it.
          Start-Process -Wait -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S', "_?=$dir"
          if (Test-Path $key) { throw 'uninstall entry left behind' }
